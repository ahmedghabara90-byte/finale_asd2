version: "3.8"

services:
  # ─── PostgreSQL (Data Warehouse) ───────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: upes_postgres
    environment:
      POSTGRES_USER: upes
      POSTGRES_PASSWORD: upes_password
      POSTGRES_DB: upes_dwh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upes -d upes_dwh"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Apache Airflow ────────────────────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.8.0
    container_name: upes_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://upes:upes_password@postgres/upes_dwh
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@upes.dz"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data

  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: upes_airflow_webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://upes:upes_password@postgres/upes_dwh
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "upes_secret_key"
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: upes_airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://upes:upes_password@postgres/upes_dwh
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      - airflow-init
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
    command: scheduler

  # ─── Apache Superset ───────────────────────────────────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: upes_superset
    environment:
      SUPERSET_SECRET_KEY: "upes_superset_secret"
      DATABASE_URL: postgresql+psycopg2://upes:upes_password@postgres/upes_dwh
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@upes.dz --password admin &&
        superset init &&
        superset run -p 8088 --with-threads --reload --debugger
      "

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: upes_api
    environment:
      DATABASE_URL: postgresql+psycopg2://upes:upes_password@postgres/upes_dwh
      SECRET_KEY: "upes_jwt_secret_key_change_in_prod"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app

  # ─── Vue.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upes_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
